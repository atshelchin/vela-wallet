# Minimal CI gate — mirrors the local checks documented in
# docs/project-takeover/02-local-development.md.
#
# Deployment coupling (since 2026-07-02): merging to main auto-deploys the web
# wallet via Cloudflare Pages git integration (→ wallet.getvela.app). These two
# jobs are the merge gate — branch protection requires both green before merge.
# CF Pages builds independently of this workflow: a CF build failure shows in
# the CF dashboard, NOT here (CI green ≠ deployed).
#
# Deliberately NOT included:
#   - Playwright E2E: boots a Metro dev server + fixture relay; run locally via
#     `npm run test:e2e` (see docs/PARALLEL-SPACE-E2E-PLAYBOOK.md). Promote to CI
#     once it has a proven-stable record on a runner.
#   - price-query real-RPC suite: opt-in only (RUN_NETWORK_TESTS=1) — it depends
#     on third-party public RPC availability, not on our code.
#   - getvela.app: separate bun/SvelteKit project, checked in its own job below.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Install Safe extension dependencies
        run: npm ci --prefix packages/safe-recovery-extension
      - name: Check Safe extension
        run: |
          npm run check --prefix packages/safe-recovery-extension
          npm test --prefix packages/safe-recovery-extension
          npm run build --prefix packages/safe-recovery-extension
      - name: Build HTTPS wallet SDK
        run: npm run build --prefix packages/vela-sdk
      - name: Lint
        run: npx expo lint -- --max-warnings=10000
      - name: Unit tests
        run: npx jest --ci
      - name: Web production build
        run: npm run build:web

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: getvela.app
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Svelte check
        run: bun run check

  # vela-core shared Rust library (specs/001-rust-core-bindings).
  # NOTE (founder action): add `rust` to branch-protection required checks so it
  # gates merges like `app` and `site` do.
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (conformance corpus + proptests)
        run: cargo test --workspace
      - name: Wasm build (getrandom canary)
        run: cargo build --target wasm32-unknown-unknown -p vela-core-wasm
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.15.0
      - name: Web build is current (rust/pkg-web committed and matching)
        working-directory: .
        run: node rust/scripts/build-web.mjs --check
      - name: Conformance corpus through the shipped web artifact
        working-directory: .
        run: node rust/scripts/verify-web.mjs
      - name: Swift bindings generate (compiled here, exercised in rust-macos)
        run: |
          cargo build --release -p vela-core-uniffi
          cargo run --release -p vela-core-uniffi --bin uniffi-bindgen -- generate \
            --library target/release/libvela_core_uniffi.so --language swift --out-dir /tmp/ubind
          test -s /tmp/ubind/vela_core_uniffi.swift
      - name: Set up JDK (for the Kotlin corpus harness)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Kotlin
        run: |
          curl -fsSL -o /tmp/kotlin.zip \
            https://github.com/JetBrains/kotlin/releases/download/v2.1.0/kotlin-compiler-2.1.0.zip
          unzip -q /tmp/kotlin.zip -d /opt
          echo "/opt/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Conformance corpus through the Kotlin bindings
        run: ./scripts/smoke-kotlin.sh

  # Swift half of the SC-001 cross-platform check — its own job because the
  # Swift toolchain needs a macOS runner, and keeping it separate leaves the
  # linux gate fast.
  rust-macos:
    runs-on: macos-15
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Conformance corpus through the Swift bindings
        run: ./scripts/smoke-swift.sh
