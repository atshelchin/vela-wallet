[package]
name = "vela-wallet"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
# Desktop has no wasm size budget, so all 15 locale catalogs compile in and
# language switch needs no I/O (spec 004 FR-014 leaves this choice per-platform).
vela-core = { path = "../../rust/crates/vela-core", features = ["i18n-all"] }
