# Cloudflare Workers Builds installs with pnpm 9, which refuses a
# pnpm-workspace.yaml that carries settings only ("ERROR packages field missing
# or empty" — the settings-only form is a pnpm 10 feature). Declaring this app
# as the single workspace package keeps the file valid from pnpm 9 to 11.
packages:
  - '.'

onlyBuiltDependencies:
  - workerd
  - sharp
  - esbuild
