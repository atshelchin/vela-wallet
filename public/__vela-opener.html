<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vela opener simulator</title>
<!--
================================================================================
 __vela-opener.html — a fake dApp tab that drives /web-request through the real
 VELA_WEB handshake. Design-capture scaffolding only; the main capture process
 deletes this file afterwards. NOTHING here is part of the shipping app.

 WHY THIS EXISTS
 ---------------
 src/app/web-request.tsx refuses to leave its `error` phase unless it was opened
 by another window (`window.opener`), and it refuses to leave `waiting` unless
 that window completes a MessageChannel handshake. Five of its seven phases are
 therefore unreachable by navigating to the route directly. This page is the
 missing opener.

 THE HANDSHAKE (both halves verified against source)
 ---------------------------------------------------
   1. This page calls window.open('/web-request?session=<id>').  A popup with no
      opener is dead on arrival: web-request.tsx:93-98 sets phase='error',
      "Open this page from a dApp using the Vela SDK."  A popup with no `session`
      query param is equally dead: web-request.tsx:88-92, "Invalid Vela request
      session."
   2. The popup boots the whole Expo app (fonts + boot tasks, RootLayout in
      src/app/_layout.tsx:152-229 — seconds, not milliseconds) and only then
      mounts the route, which posts
          { channel:'vela-web-wallet-v1', type:'VELA_WEB_READY', sessionId }
      to window.opener with targetOrigin '*', repeating every 300 ms until it is
      answered (web-request.tsx:100-109).  So this page must listen FOREVER and
      never time out.
   3. This page answers with VELA_WEB_INIT plus a transferred MessagePort.
      web-request.tsx:111-132 accepts it only if EVERY one of these holds:
        · event.source === window.opener        — only the opening window may
                                                  drive the popup (line 112)
        · isAllowedWebDAppOrigin(event.origin)  — https, or http on
                                                  localhost/127.0.0.1/[::1]
                                                  (web-popup-transport.ts:75-83)
        · isVelaWebInit(event.data)             — the full validator below
                                                  (packages/vela-sdk/src/protocol.ts:55-70)
        · event.data.sessionId === sessionId    — the id the popup was opened
                                                  with; binds the message to THIS
                                                  popup instance (line 113)
        · event.ports[0] exists                — the transferred port IS the
                                                  capability (line 113, 128-129)
   4. The wallet answers on that port with VELA_WEB_RESPONSE and closes it
      (web-request.tsx:71-85, web-popup-transport.ts:44-59) — never with a
      wildcard postMessage. We keep port1 and log whatever arrives.

 WHY EACH FIELD IS REQUIRED (protocol.ts line refs)
 --------------------------------------------------
   channel: 'vela-web-wallet-v1'  protocol.ts:1,58 — namespace guard. A page in a
       dev build is full of unrelated postMessage traffic (Metro HMR, React
       DevTools, browser extensions); without the channel tag the popup would
       have to guess.
   type: 'VELA_WEB_INIT'          protocol.ts:3,58 — direction tag (READY is
       popup→opener, INIT is opener→popup, RESPONSE is port-only).
   sessionId: string, 1..128      protocol.ts:59 — and must equal the popup's
       `session` param (web-request.tsx:113). Stops a stale opener from feeding a
       request into a popup that was opened for a different one.
   request.id: string, 1..128     protocol.ts:60 — echoed verbatim in the
       response (web-request.tsx:76) so the dApp can correlate.
   request.method: string, 1..100 protocol.ts:61 — selects the branch:
       eth_requestAccounts / wallet_requestPermissions are the CONNECT methods
       (web-request.tsx:172); anything else needs an existing grant.
   request.params: Array, and JSON.stringify(params).length <= 512 KiB
       protocol.ts:62,69 — refuses cyclic / non-JSON / RAM-bombing payloads
       before they reach the signing UI.
   request.chainId: Number.isSafeInteger && > 0
       protocol.ts:62 — then checked against getAllNetworksSync() by
       assertChainSupported (src/hooks/use-dapp-signing.ts:105-113); an unknown
       chain becomes the 4902 'unsupported-chain' phase (web-request.tsx:158-167).
   request.address: optional; /^0x[0-9a-fA-F]{40}$/ when present
       protocol.ts:64 — and must equal the granted address or the wallet answers
       4100 "The requested account is no longer authorized" (web-request.tsx:190).
       Omit it unless you know the granted address.
   dapp.name: string, length <= 200
       protocol.ts:63 — presentation only: trimmed and cut to 80 chars, and an
       empty name falls back to the origin's host (web-request.tsx:122).
   dapp.icon: optional string
       Rendered ONLY if it resolves to the SAME origin as event.origin over https
       (or http on localhost/127.0.0.1) — trustedDAppLogo, web-request.tsx:39-50.
       A cross-origin icon is dropped and the initials tile is drawn instead.
   dapp.url: IGNORED. web-request.tsx:123 overwrites it with event.origin; the
       security identity is always the real origin, never metadata.

 ORIGIN NOTE
   Served from the dev server, this page's origin is http://localhost:8081 — the
   same origin as the popup. isAllowedWebDAppOrigin allows http on localhost, so
   the handshake passes, and the consent card's origin pill will read
   "localhost:8081" (not a pretty dApp host). That is the truth of a localhost
   capture and should be stated on the board.

 QUERY STRING
   phase=waiting|consent|onboarding|unsupported-chain|processing|done|invalid
        preset that fills in mode/method/chainId (default: consent)
   mode=init|silent|invalid
        init    send a valid VELA_WEB_INIT once the popup says READY
        silent  answer NOTHING — the popup holds phase 'waiting' forever
        invalid send an INIT that isVelaWebInit REJECTS (chainId as a string) —
                also holds 'waiting', but proves the validator rather than the
                absence of a reply
   method=      RPC method (default per phase)
   chainId=     integer (default 100 Gnosis; 999999 for unsupported-chain)
   name=        dApp display name (default "Demo dApp")
   icon=        same-origin icon path, e.g. /og-image.png (default: none, so the
                popup draws the initials tile)
   url=         dApp url metadata (ignored by the wallet; recorded for honesty)
   address=     0x… to put in request.address (default: omitted)
   id=          request id (default vela-capture-<phase>-<rand>)
   params=      JSON array, overrides the per-method default
   session=     popup session id (default capture-<phase>) — keep it DETERMINISTIC
                so the popup URL in the capture spec is predictable
   popup=1      open a sized popup WINDOW instead of a tab (w=, h=, default
                390x844). Default popup=0 → a TAB, which inherits the main
                window's viewport, so the board matches every other 390x844
                capture.
   auto=0       do not attempt window.open on load (click the button instead)
   reinit=0     do not re-handshake if the popup remounts
   targetOrigin=  override the postMessage target origin (default: this origin)

 WHAT THIS PAGE WILL NOT DO
   · It never touches the popup's DOM and never clicks anything inside it
     (same-origin makes that possible; the capture must record what the app does
     on its own, so it is forbidden here).
   · It never writes localStorage, never mints a passkey, never POSTs anywhere,
     never broadcasts anything. Sending an INIT is a postMessage and nothing else.
   · It never closes or reloads itself: the popup's `window.opener` must stay
     alive for the whole capture.

 READ THE RESULT
   window.__openerState — config, generated session id, popup URL, READY count,
   the exact INIT that was sent, a local re-run of the wallet's own validator
   over that INIT (`selfCheck`), any port responses, and a timestamped log.
================================================================================
-->
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; padding: 24px; font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
         background: #faf9f7; color: #1a1a18; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  p.sub { margin: 0 0 18px; color: #8a8580; }
  button { font: inherit; font-weight: 700; padding: 12px 18px; border: 0; border-radius: 12px;
           background: #E8572A; color: #fff; cursor: pointer; }
  button[disabled] { opacity: .45; cursor: default; }
  table { border-collapse: collapse; margin: 14px 0; }
  td { padding: 2px 14px 2px 0; vertical-align: top; }
  td.k { color: #8a8580; }
  pre { background: #fff; border: 1px solid #e6e3df; border-radius: 10px; padding: 12px;
        max-height: 320px; overflow: auto; white-space: pre-wrap; word-break: break-all; }
  .bad { color: #c0392b; font-weight: 700; }
  .ok { color: #1e7a45; font-weight: 700; }
  @media (prefers-color-scheme: dark) {
    body { background: #14140f; color: #f5f3ef; }
    pre { background: #1c1c16; border-color: #2e2e26; }
    td.k, p.sub { color: #8f8a82; }
  }
</style>
</head>
<body>
<h1>Vela opener simulator</h1>
<p class="sub">Design-capture scaffolding. Opens /web-request and completes the VELA_WEB handshake. Never clicks inside the popup.</p>
<button id="open-popup">Open Vela request popup</button>
<div id="cfg"></div>
<pre id="log">booting…</pre>

<script>
(function () {
  'use strict';

  // ---- protocol constants: must match packages/vela-sdk/src/protocol.ts:1-4 ----
  var CHANNEL = 'vela-web-wallet-v1';
  var READY = 'VELA_WEB_READY';
  var INIT = 'VELA_WEB_INIT';
  var RESPONSE = 'VELA_WEB_RESPONSE';

  // A popup that remounts (e.g. a pushState/popstate re-navigation from a capture
  // harness) restarts its 300 ms READY loop. If we see READY again this long after
  // our last INIT, the popup is a NEW instance and needs a fresh port.
  var REINIT_GAP_MS = 1500;

  var q = new URLSearchParams(location.search);
  var t0 = Date.now();

  var PRESETS = {
    'waiting':           { mode: 'silent',  method: 'eth_requestAccounts', chainId: 100 },
    'consent':           { mode: 'init',    method: 'eth_requestAccounts', chainId: 100 },
    'onboarding':        { mode: 'init',    method: 'eth_requestAccounts', chainId: 100 },
    'unsupported-chain': { mode: 'init',    method: 'eth_requestAccounts', chainId: 999999 },
    'processing':        { mode: 'init',    method: 'personal_sign',       chainId: 100 },
    'done':              { mode: 'init',    method: 'eth_requestAccounts', chainId: 100 },
    'invalid':           { mode: 'invalid', method: 'eth_requestAccounts', chainId: 100 }
  };

  var phase = (q.get('phase') || 'consent').toLowerCase();
  var preset = PRESETS[phase] || PRESETS.consent;

  function num(v, dflt) { var n = Number(v); return Number.isFinite(n) ? n : dflt; }
  function flag(v, dflt) { return v == null ? dflt : !(v === '0' || v === 'false' || v === 'no'); }

  function utf8ToHex(s) {
    var b = new TextEncoder().encode(s), out = '0x';
    for (var i = 0; i < b.length; i++) out += b[i].toString(16).padStart(2, '0');
    return out;
  }

  var cfg = {
    phase: phase,
    presetKnown: !!PRESETS[phase],
    mode: (q.get('mode') || preset.mode).toLowerCase(),
    method: q.get('method') || preset.method,
    chainId: num(q.get('chainId'), preset.chainId),
    name: q.get('name') || 'Demo dApp',
    icon: q.get('icon') || undefined,     // must be same-origin to render
    url: q.get('url') || location.origin, // IGNORED by the wallet
    address: q.get('address') || undefined,
    requestId: q.get('id') || ('vela-capture-' + phase + '-' + Math.random().toString(36).slice(2, 8)),
    sessionId: q.get('session') || ('capture-' + phase),
    asPopupWindow: flag(q.get('popup'), false),
    width: num(q.get('w'), 390),
    height: num(q.get('h'), 844),
    auto: flag(q.get('auto'), true),
    reinit: flag(q.get('reinit'), true),
    targetOrigin: q.get('targetOrigin') || location.origin
  };

  // Default params per method. Kept small on purpose: protocol.ts:69 caps
  // JSON.stringify(params) at 512 KiB.
  function defaultParams(method, address) {
    if (method === 'wallet_requestPermissions') return [{ eth_accounts: {} }];
    if (method === 'personal_sign') {
      var msg = utf8ToHex('Vela design capture. Nothing is signed by the harness.');
      return address ? [msg, address] : [msg];
    }
    if (method === 'eth_signTypedData_v4') return [];   // needs a real address; supply ?params=
    return [];                                          // eth_requestAccounts, eth_accounts, …
  }

  var params;
  var paramsError = null;
  if (q.get('params')) {
    try {
      params = JSON.parse(q.get('params'));
      if (!Array.isArray(params)) { paramsError = 'params= is not a JSON array; using the default'; params = null; }
    } catch (e) { paramsError = 'params= is not valid JSON: ' + e.message; params = null; }
  }
  if (!params) params = defaultParams(cfg.method, cfg.address);

  var popupUrl = '/web-request?session=' + encodeURIComponent(cfg.sessionId);
  var target = 'vela-web-request-' + cfg.sessionId;

  var state = window.__openerState = {
    version: 1,
    href: location.href,
    origin: location.origin,
    config: cfg,
    params: params,
    paramsError: paramsError,
    popupUrl: popupUrl,
    popupTarget: target,
    opened: false,
    blocked: false,
    readyCount: 0,
    initCount: 0,
    lastInitAt: 0,
    lastInit: null,        // the exact message object we posted (port not shown)
    selfCheck: null,       // our local re-run of the wallet's isVelaWebInit
    responses: [],         // VELA_WEB_RESPONSE payloads received on port1
    ignored: [],           // messages that looked wrong (sessionId mismatch etc.)
    errors: [],
    log: []
  };

  var logEl = document.getElementById('log');
  function log(msg) {
    state.log.push({ t: Date.now() - t0, msg: msg });
    if (logEl) logEl.textContent = state.log.map(function (l) {
      return String(l.t).padStart(6, ' ') + 'ms  ' + l.msg;
    }).join('\n');
  }

  // ---- exact mirror of isVelaWebInit (protocol.ts:55-70) -------------------
  // Run locally over the message we are about to send, so a capture operator can
  // see PASS/FAIL without having to read the popup's console.
  function validateInit(v) {
    function no(r) { return { ok: false, reason: r }; }
    if (!v) return no('falsy message');
    if (v.channel !== CHANNEL) return no('channel !== ' + CHANNEL);
    if (v.type !== INIT) return no('type !== ' + INIT);
    if (typeof v.sessionId !== 'string' || v.sessionId.length < 1 || v.sessionId.length > 128) return no('sessionId must be a 1..128 char string');
    var r = v.request;
    if (!r) return no('request missing');
    if (typeof r.id !== 'string' || r.id.length < 1 || r.id.length > 128) return no('request.id must be a 1..128 char string');
    if (typeof r.method !== 'string' || r.method.length < 1 || r.method.length > 100) return no('request.method must be a 1..100 char string');
    if (!Array.isArray(r.params)) return no('request.params must be an Array');
    if (!Number.isSafeInteger(r.chainId) || Number(r.chainId) <= 0) return no('request.chainId must be a safe integer > 0');
    if (!v.dapp) return no('dapp missing');
    if (typeof v.dapp.name !== 'string' || v.dapp.name.length > 200) return no('dapp.name must be a string <= 200 chars');
    if (r.address != null && (typeof r.address !== 'string' || !/^0x[0-9a-fA-F]{40}$/.test(r.address))) return no('request.address must be 0x + 40 hex');
    try {
      if (JSON.stringify(r.params).length > 512 * 1024) return no('request.params exceeds 512 KiB');
    } catch (e) { return no('request.params is not JSON-serialisable'); }
    return { ok: true, reason: 'passes isVelaWebInit' };
  }

  function buildInit() {
    var request = {
      id: cfg.requestId,
      method: cfg.method,
      params: params,
      chainId: cfg.chainId
    };
    if (cfg.address) request.address = cfg.address;
    var dapp = { name: cfg.name, url: cfg.url };
    if (cfg.icon) dapp.icon = cfg.icon;
    var msg = { channel: CHANNEL, type: INIT, sessionId: cfg.sessionId, request: request, dapp: dapp };
    if (cfg.mode === 'invalid') {
      // Deliberately violate protocol.ts:62 (chainId must be a safe integer).
      // isVelaWebInit returns false, the popup ignores the message and keeps
      // announcing READY, so the phase stays 'waiting'.
      msg.request = Object.assign({}, request, { chainId: String(cfg.chainId) });
    }
    return msg;
  }

  var popupWin = null;

  function openPopup() {
    if (popupWin && !popupWin.closed) { log('popup already open — reusing ' + target); return popupWin; }
    var features = cfg.asPopupWindow ? ('popup=1,width=' + cfg.width + ',height=' + cfg.height) : '';
    // No 'noopener': the popup's window.opener IS the handshake channel
    // (web-request.tsx:93). noopener would make the route unreachable.
    popupWin = window.open(popupUrl, target, features);
    if (!popupWin) {
      state.blocked = true;
      log('window.open returned null — Chrome blocked it (no user activation). Click "Open Vela request popup".');
      render();
      return null;
    }
    state.opened = true;
    state.blocked = false;
    log('opened ' + popupUrl + ' as ' + (cfg.asPopupWindow ? 'a popup window ' + cfg.width + 'x' + cfg.height : 'a tab'));
    log('waiting for VELA_WEB_READY (the popup boots the whole Expo bundle first — seconds)');
    render();
    return popupWin;
  }

  function sendInit() {
    if (!popupWin || popupWin.closed) { log('cannot send INIT: no popup'); return; }
    var msg = buildInit();
    var check = validateInit(msg);
    state.selfCheck = check;
    var ch = new MessageChannel();
    // Assigning onmessage implicitly starts port1 — no explicit start() needed.
    ch.port1.onmessage = function (ev) {
      var d = ev.data;
      state.responses.push(d);
      var kind = (d && d.type === RESPONSE) ? 'VELA_WEB_RESPONSE' : 'unexpected port message';
      log(kind + ': ' + safeJson(d));
      render();
    };
    ch.port1.onmessageerror = function () { state.errors.push('port messageerror'); log('port messageerror'); };
    try {
      // The transferred port2 becomes event.ports[0] in the popup
      // (web-request.tsx:113,128). Exact targetOrigin, never '*'.
      popupWin.postMessage(msg, cfg.targetOrigin, [ch.port2]);
    } catch (e) {
      state.errors.push('postMessage failed: ' + e.message);
      log('postMessage FAILED: ' + e.message);
      render();
      return;
    }
    state.initCount++;
    state.lastInitAt = Date.now();
    state.lastInit = msg;
    log('sent VELA_WEB_INIT #' + state.initCount + ' (' + cfg.method + ' on chain ' + cfg.chainId +
        ') + MessagePort → ' + cfg.targetOrigin + '  [' + (check.ok ? 'valid' : 'INVALID: ' + check.reason) + ']');
    render();
  }

  function safeJson(v) { try { return JSON.stringify(v); } catch (e) { return '<unserialisable>'; } }

  window.addEventListener('message', function (ev) {
    // Only our popup may drive this page. Metro HMR and devtools also post here.
    if (popupWin && ev.source !== popupWin) return;
    var d = ev.data;
    if (!d || d.channel !== CHANNEL) return;
    if (d.type !== READY) { state.ignored.push({ origin: ev.origin, data: d }); return; }
    if (d.sessionId !== cfg.sessionId) {
      state.ignored.push({ why: 'sessionId mismatch', got: d.sessionId, want: cfg.sessionId });
      log('ignored READY for a different session: ' + d.sessionId);
      return;
    }
    state.readyCount++;
    if (state.readyCount === 1) log('VELA_WEB_READY from ' + ev.origin + ' (session ' + d.sessionId + ')');

    if (cfg.mode === 'silent') {
      if (state.readyCount === 1) log('mode=silent → answering nothing; the popup will hold phase "waiting" (web-request.tsx:62,334-340)');
      render();
      return;
    }
    var since = Date.now() - state.lastInitAt;
    if (state.initCount > 0 && (!cfg.reinit || since < REINIT_GAP_MS)) return;
    if (state.initCount > 0) log('popup restarted its READY loop ' + since + 'ms after our last INIT → it remounted; re-arming with a fresh port');
    sendInit();
  });

  function render() {
    var rows = [
      ['phase', cfg.phase + (cfg.presetKnown ? '' : ' (unknown preset → consent defaults)')],
      ['mode', cfg.mode],
      ['popup url', popupUrl],
      ['method', cfg.method],
      ['chainId', String(cfg.chainId)],
      ['params', safeJson(params)],
      ['dapp.name', cfg.name],
      ['dapp.icon', cfg.icon || '(none → initials tile)'],
      ['request.address', cfg.address || '(omitted)'],
      ['targetOrigin', cfg.targetOrigin],
      ['opened', state.opened ? 'yes' : (state.blocked ? 'BLOCKED — click the button' : 'not yet')],
      ['READY seen', String(state.readyCount)],
      ['INIT sent', String(state.initCount)],
      ['self-check', state.selfCheck ? (state.selfCheck.ok ? 'valid' : 'INVALID: ' + state.selfCheck.reason) : '—'],
      ['responses', String(state.responses.length)]
    ];
    var html = '<table>';
    for (var i = 0; i < rows.length; i++) {
      var v = String(rows[i][1]).replace(/&/g, '&amp;').replace(/</g, '&lt;');
      var cls = /BLOCKED|INVALID/.test(v) ? ' class="bad"' : (v === 'valid' ? ' class="ok"' : '');
      html += '<tr><td class="k">' + rows[i][0] + '</td><td' + cls + '>' + v + '</td></tr>';
    }
    document.getElementById('cfg').innerHTML = html + '</table>';
  }

  document.getElementById('open-popup').addEventListener('click', function () { openPopup(); });

  // Programmatic seams for a devtools driver. window.open from an evaluated
  // script usually lacks user activation and will be blocked — clicking
  // #open-popup with a real input event is the reliable path.
  window.__openerOpen = openPopup;
  window.__openerSendInit = sendInit;
  window.__openerValidate = validateInit;

  render();
  log('opener ready · phase=' + cfg.phase + ' mode=' + cfg.mode + ' session=' + cfg.sessionId);
  if (paramsError) { state.errors.push(paramsError); log('WARNING: ' + paramsError); }
  document.title = 'Vela opener · ' + cfg.phase + ' · ' + cfg.sessionId;
  if (cfg.auto) openPopup();
})();
</script>
</body>
</html>
