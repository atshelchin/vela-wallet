[workspace]
resolver = "2"
members = [
  "crates/vela-core",
  "crates/vela-core-uniffi",
  "crates/vela-core-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

# Single source of truth for versions — pins per specs/001-rust-core-bindings/research.md.
# NEVER bump uniffi alone: Kotlin/Swift/wasm bindings must regenerate together (checksum coupling).
[workspace.dependencies]
vela-core = { path = "crates/vela-core" }

alloy-primitives = { version = "1.6.1", default-features = false, features = ["std"] }
alloy-dyn-abi = { version = "1.6.1", default-features = false, features = ["std", "eip712"] }
alloy-json-abi = { version = "1.6.1", default-features = false, features = ["std"] }
sha2 = "0.11.0"
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "alloc"] }
ecdsa = { version = "0.17.0", default-features = false, features = ["der", "alloc"] }
ciborium = { version = "0.2.2", default-features = false }
ciborium-io = { version = "0.2.2", default-features = false }
coset = { version = "0.4.2", default-features = false }
base64 = "0.22"
# ECMAScript-compliant f64 -> string (Boa's formatter). The identicon hash slices
# the DECIMAL STRING of a chaotic double, so Number::toString semantics — including
# its tie-break rule — are part of the algorithm. std's formatter disagrees with V8
# on ties: specs/003-rust-identicon/research.md D2.
ryu-js = "1.0.3"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

uniffi = "0.32.0"
wasm-bindgen = "0.2.126"
tsify = { version = "0.5.6", default-features = false, features = ["js"] }
serde-wasm-bindgen = "0.6.5"

proptest = "1"
hex-literal = "1"

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
